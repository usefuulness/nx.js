<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{name}}</title>
  </head>
  <body style="max-width: 28rem; margin: 3rem auto; padding: 0 1rem">
    <!-- The tags work as plain HTML. Nothing to install or build. -->
    <nx-card title="Hello, nx.js" subtitle="Edit index.html and reload.">
      <nx-input name="name" label="Your name" placeholder="Ada Lovelace"></nx-input>
      <nx-select name="role" label="Role">
        <option>Designer</option>
        <option>Engineer</option>
        <option>Product</option>
      </nx-select>
      <div slot="footer" style="display: contents">
        <nx-button variant="outline">Cancel</nx-button>
        <nx-button id="save">Save</nx-button>
      </div>
    </nx-card>

    <script src="https://unpkg.com/nx.js{{nxRange}}/dist/nx.umd.js"></script>
    <script>
      document.getElementById('save').addEventListener('click', () => NX.toast.success('Saved!'));
    </script>
  </body>
</html>
